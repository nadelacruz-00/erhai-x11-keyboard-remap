name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 is deliberately NOT used - it fails on current
      # runner images ("Failed to find package 'tools'"). ubuntu-latest already ships a full
      # Android SDK, so we just use it and top up any missing components.
      - name: Android SDK components
        run: |
          set -x
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk 35 is required by androidx.core 1.16.0, which Material 1.14.0 pulls in.
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: List outputs
        if: always()
        run: find . -path '*/build/outputs/apk/*' -name '*.apk' -exec ls -la {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pad3-apks
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
