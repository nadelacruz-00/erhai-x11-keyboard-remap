name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# contents: write is needed to publish the release; the rest stays read-only.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 is deliberately NOT used - it fails on current
      # runner images ("Failed to find package 'tools'"). ubuntu-latest already ships a full
      # Android SDK, so we just use it and top up what is missing.
      - name: Android SDK components
        run: |
          set -x
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # compileSdk 35 is required by androidx.core 1.16.0, which Material 1.14.0 pulls in.
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3 || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp remap/build/outputs/apk/debug/remap-debug.apk dist/Erhai-X11-Keyboard-Remap.apk
          cp app/build/outputs/apk/debug/app-debug.apk       dist/Erhai-X11-KeyLog.apk
          ls -la dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: erhai-x11-apks
          path: dist/*.apk
          if-no-files-found: error

      # A rolling "latest" release, refreshed on every push to main, so there is always a direct
      # download link for the newest build without having to dig through workflow artifacts.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*.apk
          body: |
            Automatic build of the newest `main`.

            **Erhai-X11-Keyboard-Remap.apk** — the app *and* the LSPosed module, plus the
            KernelSU keymap module bundled inside it (installed on first launch once root is
            granted).

            **Erhai-X11-KeyLog.apk** — optional diagnostic tool: shows exactly what the
            application layer receives for each key press.

            See the README for install steps, limitations and credits.
