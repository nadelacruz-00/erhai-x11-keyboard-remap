plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minis.keylog'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.minis.keylog'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Committed debug keystore: CI runners generate a fresh one per job, which would give every
    // build a different signature and make in-place updates impossible.
    signingConfigs {
        debug {
            storeFile file("$rootDir/keystore/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
