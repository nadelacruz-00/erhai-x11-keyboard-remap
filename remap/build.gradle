plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.erhai.kbremap'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.erhai.kbremap'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Committed debug keystore: CI runners generate a fresh one per job, which would give every
    // build a different signature and make in-place updates impossible.
    signingConfigs {
        debug {
            storeFile file("$rootDir/keystore/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // LSPosed provides the real implementation at runtime; we only compile against the API.
    compileOnly 'de.robv.android.xposed:api:82'

    // Material 3 Expressive, in Views - no Kotlin and no Compose needed. Verified against the
    // published AAR: it has no compileSdk/AGP minimum of its own, BUT it pulls androidx.core
    // 1.16.0 (minCompileSdk 35, minAGP 8.6.0) transitively, which is why this module is on
    // compileSdk 35 and the root AGP was raised to 8.7.3.
    // It ships the real thing: Theme.Material3Expressive.*, Widget.Material3Expressive.* and the
    // Motion_Material3_Spring_Expressive_* motion tokens.
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // SpringAnimation, so our own animations can use the Expressive spring specs directly.
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
