plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minis.kbremap'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.minis.kbremap'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // LSPosed provides the real implementation at runtime; we only compile against the API.
    compileOnly 'de.robv.android.xposed:api:82'
}
